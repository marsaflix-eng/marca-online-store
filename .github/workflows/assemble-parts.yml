name: Assemble storefront parts
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate parts and enable Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          from pathlib import Path
          import shutil, re
          def part_num(p):
            m = re.search(r'part(\d+)', p.name)
            return int(m.group(1)) if m else 0
          def parts_for(patterns):
            found = []
            for pat in patterns:
              found.extend(Path('_parts').rglob(pat))
            return sorted(set(found), key=part_num)
          mapping = {
            'index.html': parts_for(['index.html.part*']),
            '404.html': parts_for(['404.html.part*']),
            'css/styles.css': parts_for(['styles.css.part*']),
            'js/app.js': parts_for(['app.js.part*']),
          }
          for dest, parts in mapping.items():
            assert parts, f'missing parts for {dest}: {[p.name for p in Path("_parts").rglob("*") if p.is_file()]}'
            text = ''.join(p.read_text(encoding='utf-8') for p in parts)
            Path(dest).parent.mkdir(parents=True, exist_ok=True)
            Path(dest).write_text(text, encoding='utf-8')
            print('wrote', dest, len(text), 'from', [p.name for p in parts])
          shutil.rmtree('_parts', ignore_errors=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo no changes; else git commit -m "Assemble full Marça storefront from text parts" && git push; fi
          python3 << 'PY'
          import json, os, urllib.request, urllib.error
          from pathlib import Path
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/pages'
          headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          }
          body = json.dumps({"build_type":"legacy","source":{"branch":"main","path":"/"}}).encode()
          for method in ('POST','PUT'):
            req = urllib.request.Request(url, data=body, method=method, headers=headers)
            try:
              with urllib.request.urlopen(req) as resp:
                print('pages', method, resp.status, resp.read()[:300]); break
            except urllib.error.HTTPError as e:
              print('pages', method, e.code, e.read()[:300])
          cname = Path('CNAME').read_text().strip() if Path('CNAME').exists() else 'xn--mara-2oa.online'
          body2 = json.dumps({"cname": cname, "https_enforced": True}).encode()
          req = urllib.request.Request(url, data=body2, method='PUT', headers=headers)
          try:
            with urllib.request.urlopen(req) as resp:
              print('cname', resp.status, resp.read()[:300])
          except urllib.error.HTTPError as e:
            print('cname', e.code, e.read()[:300])
          PY
