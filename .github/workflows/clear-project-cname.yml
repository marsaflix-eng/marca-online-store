name: Clear project Pages custom domain
on:
  workflow_dispatch:
permissions:
  pages: write
  contents: read
jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Remove custom domain from project Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/pages'
          headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          }
          def get():
            req = urllib.request.Request(url, method='GET', headers={k:v for k,v in headers.items() if k!='Content-Type'})
            try:
              with urllib.request.urlopen(req) as resp:
                body = resp.read().decode()
                print('GET', resp.status, body)
                return json.loads(body)
            except urllib.error.HTTPError as e:
              print('GET', e.code, e.read().decode())
              return None
          before = get()
          # Remove custom domain claim so user site can own xn--mara-2oa.online
          payload = {'cname': None}
          req = urllib.request.Request(url, data=json.dumps(payload).encode(), method='PUT', headers=headers)
          try:
            with urllib.request.urlopen(req) as resp:
              print('PUT cname=null', resp.status, resp.read().decode())
          except urllib.error.HTTPError as e:
            print('PUT cname=null', e.code, e.read().decode())
          after = get()
          if after:
            print('custom_domain=', after.get('cname'), 'https_enforced=', after.get('https_enforced'), 'status=', after.get('status'))
          PY
