name: Enable GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create or update Pages site (no custom domain)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import json, os, urllib.request, urllib.error
          token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          url = f'https://api.github.com/repos/{repo}/pages'
          headers = {
            'Authorization': f'Bearer {token}',
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28',
            'Content-Type': 'application/json',
          }
          # GET current
          req = urllib.request.Request(url, method='GET', headers={k:v for k,v in headers.items() if k!='Content-Type'})
          try:
            with urllib.request.urlopen(req) as resp:
              print('GET pages', resp.status, resp.read().decode()[:800])
          except urllib.error.HTTPError as e:
            print('GET pages', e.code, e.read().decode()[:800])
          body = json.dumps({"build_type":"legacy","source":{"branch":"main","path":"/"}}).encode()
          for method in ('POST','PUT'):
            req = urllib.request.Request(url, data=body, method=method, headers=headers)
            try:
              with urllib.request.urlopen(req) as resp:
                print(method, resp.status, resp.read().decode()[:800])
                break
            except urllib.error.HTTPError as e:
              print(method, e.code, e.read().decode()[:800])
          # Never claim xn--mara-2oa.online here; that domain belongs to marsaflix-eng.github.io
          req = urllib.request.Request(url, data=json.dumps({"cname": None}).encode(), method='PUT', headers=headers)
          try:
            with urllib.request.urlopen(req) as resp:
              print('cname clear', resp.status, resp.read().decode()[:800])
          except urllib.error.HTTPError as e:
            print('cname clear', e.code, e.read().decode()[:800])
          req = urllib.request.Request(url, method='GET', headers={k:v for k,v in headers.items() if k!='Content-Type'})
          try:
            with urllib.request.urlopen(req) as resp:
              print('GET final', resp.status, resp.read().decode()[:800])
          except urllib.error.HTTPError as e:
            print('GET final', e.code, e.read().decode()[:800])
          PY
